name: Azura Time Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Extract Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | awk '{print $NF}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/azura-key.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute $(find app/build/outputs/apk/release -name "*.apk" | head -n 1) --app ${{ secrets.FIREBASE_APP_ID }} --testers "osengprogrammer@gmail.com"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Update version.json for In-App Updates
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_FILENAME=$(basename "$APK_PATH")
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          # Update docs/version.json
          cat > docs/version.json << EOF
          {
            "latest_version": "${{ steps.get_version.outputs.VERSION_NAME }}",
            "latest_version_code": ${{ steps.get_version.outputs.VERSION_CODE }},
            "min_supported_version_code": 3600,
            "release_notes": "Automated build from GitHub Actions ✅",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION_NAME }}/$APK_FILENAME",
            "sha256": "$SHA"
          }
          EOF

      - name: Commit and Push version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git commit -m "chore: update version.json to v${{ steps.get_version.outputs.VERSION_NAME }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
          name: Azura Time v${{ steps.get_version.outputs.VERSION_NAME }}
          body: "Automated release via GitHub Actions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
