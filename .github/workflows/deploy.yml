name: Build and Deploy Release

on:
  push:
    tags:
      - 'v*'  # Only trigger on version tags (e.g., v3.7.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$(grep "versionCode" app/build.gradle.kts | grep -oE '[0-9]+$')" >> $GITHUB_OUTPUT
      
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease
      
      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*universal*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f ! -name "*unaligned*" | head -n 1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
      
      - name: Calculate SHA256
        id: sha256
        run: |
          SHA=$(sha256sum ${{ steps.find_apk.outputs.apk_path }} | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          body: |
            ## 🚀 Azura Time ${{ steps.version.outputs.version }}
            
            ### 📦 What's Included
            - Universal APK for all devices
            - SHA256: `${{ steps.sha256.outputs.sha256 }}`
            - versionCode: `${{ steps.version.outputs.version_code }}`
            
            ### 📋 Installation
            1. Download the APK below
            2. Enable "Install from Unknown Sources"
            3. Install and grant permissions
            
            ---
            *Automated release from tag ${{ github.ref_name }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update version.json
        run: |
          mkdir -p docs
          cat > docs/version.json << EOF
          {
            "latest_version": "${{ steps.version.outputs.version }}",
            "latest_version_code": ${{ steps.version.outputs.version_code }},
            "min_supported_version_code": 3600,
            "release_notes": "Automated release from CI",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.find_apk.outputs.apk_name }}",
            "sha256": "${{ steps.sha256.outputs.sha256 }}"
          }
          EOF
          
          # Commit and push to gh-pages branch
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -b gh-pages || git checkout gh-pages
          git add docs/version.json
          git commit -m "chore: update version.json to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
