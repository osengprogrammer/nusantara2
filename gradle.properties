# 🛑 STRICT LIMIT FOR 4GB RAM LAPTOPS
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# 🚀 PERFORMANCE TWEAKS
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=2

# ⚡ ANDROIDX CONFIGURATION (REQUIRED)
android.useAndroidX=true
android.enableJetifier=false

# ⚡ KOTLIN & KAPT MEMORY SAVERS
kapt.incremental.apt=true
kapt.use.worker.free=false
kapt.include.compile.classpath=false
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx512m
